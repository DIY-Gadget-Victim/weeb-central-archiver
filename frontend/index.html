<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Manga Downloader</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <div class="container text-center mt-5">
            <h1>Weeb Central Manga Downloader</h1>
        </div>
        <form id="downloadForm">
            <div class="ms-5 me-5">
                <label for="seriesId" class="form-label">Series ID:</label>
                <input
                    type="text"
                    class="form-control"
                    id="seriesId"
                    name="seriesId"
                    required
                />
                <div class="form-text">
                    This ID can be found in the URL of the manga on Weeb
                    Central. For example, the URL might look like
                    this:'https://weebcentral.com/series/01J76XYDGDQERFSK333582BNBZ/Sousou-no-Frieren'.
                    Here, the ID is '01J76XYDGDQERFSK333582BNBZ'.
                </div>
                <br /><br />
            </div>
            <div class="ms-5 me-5">
                <label for="mangaTitle" class="form-label">Manga Title:</label>
                <input
                    type="text"
                    class="form-control"
                    id="mangaTitle"
                    name="mangaTitle"
                    required
                /><br /><br />
            </div>
            <button
                type="submit"
                class="btn btn-primary position-relative start-50 translate-middle"
            >
                Download
            </button>
        </form>

        <script src="/app.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
